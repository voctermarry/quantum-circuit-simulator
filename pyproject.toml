[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "_release_build"
backend-path = ["."]

[project]
name = "quantum-circuit-simulator"
version = "0.1.0"
description = "Quantum circuit construction, simulation and verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quantum-circuit-simulator = "quantum_circuit.cli:main"

[tool.setuptools]
packages = ["quantum_circuit"]
